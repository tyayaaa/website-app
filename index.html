<html>
<head>
    <meta charset="UTF-8">
    <title>Login ea</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form action="" class="form">
        <h2>Login</h2>
        <p style="text-align: left">Username: </p><input type="text" name="username" placeholder="Username">
        <p style="text-align: left">Password: </p><input type="password" name="password" placeholder="Password">

        <button type="submit">Login</button>
    </form>

    <script>
        const formLogin = document.querySelector('.form');

        formLogin.addEventListener('submit', async event => {
            event.preventDefault();

            const formData = new FormData(formLogin);
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch('http://localhost:7000/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error('Login failed');
                }

                const responseData = await response.json();
                console.log(responseData);

                // Display notification
                alert('Login successful');

                // Redirect to userList.html
                window.location.href = './userList.html';
            } catch (error) {
                console.error('Error:', error.message);
            }
        });
    </script>
</body>
</html>
