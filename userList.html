<!-- userlist.html -->

<html>
<head>
    <meta charset="UTF-8">
    <title>User List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="user-list-container">
        <h2>User List</h2>
        <p><a href="./createUser.html">Add User</a></p>
        <table>
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Username</th>
                    <th>Name</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="userList"></tbody>
        </table>
    </div>

    <script>
        // Fetch user data from the API and render it on the page
        const fetchUserList = async () => {
            try {
                const response = await fetch('http://localhost:7000/user');

                if (!response.ok) {
                    throw new Error('Failed to fetch user list');
                }

                const userList = await response.json();
                renderUserList(userList);
            } catch (error) {
                console.error('Error:', error.message);
            }
        };

        // Render user list in a table on the page
        const renderUserList = (userList) => {
            const userListBody = document.getElementById('userList');

            if (userList.length === 0) {
                userListBody.innerHTML = '<tr><td colspan="4">No users found.</td></tr>';
            } else {
                const userListHTML = userList.map(user => `
                    <tr>
                        <td>${user.userid}</td>
                        <td>${user.username}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                    </tr>
                `).join('');
                userListBody.innerHTML = userListHTML;
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            fetchUserList();
        });
    </script>
</body>
</html>
